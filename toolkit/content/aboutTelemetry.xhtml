        <li>MR2-2885 - Onboarding metrics
          <ul>Request for data collection review form
            <p>
              All questions are mandatory. You must receive review from a data steward peer on your responses to these
              questions before shipping new data collection.
              1. What questions will you answer with this data?
            <blockquote>
              This data instruments the onboarding funnel for Flowstate. We want to understand where users drop off in
              the
              onboarding flow, as well as how long it takes them to complete each step.
            </blockquote>

            2. Why does Mozilla need to answer these questions? Are there benefits for users? Do we need this
            information to address product or business requirements? Some example responses:

            <blockquote>
              Product will use this information to understand the onboarding user experience, and to inform decisions on
              how best to improve the onboarding experience. The events are structured so that we can experiment with
              different arrangements of screens in the future.
            </blockquote>

            3. What alternative methods did you consider to answer these questions? Why were they not sufficient?
            <blockquote>
              Instrumentation is necessary for us to understand user completion and dropoff at each step in the
              onboarding
              funnel.
            </blockquote>
            4. Can current instrumentation answer these questions?
            <blockquote>
              No, because this onboarding flow is new.
            </blockquote>

            5. List all proposed measurements and indicate the category of data collection for each measurement, using
            the Firefox data collection categories found on the Mozilla wiki.

            Note that the data steward reviewing your request will characterize your data collection based on the
            highest (and most sensitive) category.
            <blockquote>
              Currently, onboarding is a sequence of steps which must be completed in order.

              At each step in the flow, we will record an event when the card is shown, and another when it is completed
              (i.e., when the user has clicked a button to advance to the next step.)

              We'll record these as events with the category onboarding, and with the method either shown or completed.
              We
              will also record the name of each card in the object field; the initial sequence will be welcome,
              connect_account, account_connected, data_preferences, ready_to_go. Because the order of cards may vary, we
              will encode the sequence using two key-value pairs in the extra field: order, to record the numbering of a
              given card in the sequence of cards, starting at 0 for the first card; and is_last, a boolean value, to
              record whether a given card was the last one in the onboarding flow. From these events, we will be able to
              infer the overall onboarding start and finish steps and times.

              For ease of data review, each combination of category, method, and object will be listed in the table
              below,
              using the extra fields to indicate ordering for the initial version.

              Note that these values will also be mirrored to Glean.
            </blockquote>
