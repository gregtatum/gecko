[DEFAULT]
subsuite = pinebuild
dupe-manifest =
support-files =
  head.js
  moz.png
  example.html
  download.html
  loginForm.html
prefs =
  browser.companion.stagemanagerdebugging=true
  browser.companion.stagemanagerdebugging.logLevel=All
  browser.places.perwindowsessions.enabled=true
  browser.river.activationTimeout=0
  browser.pinebuild.active-view-manager.testing.enabled=true
  browser.pinebuild.interstitial-view-overwriting.enabled=false
  browser.snapshots.scorer.log=true
  browser.river.pinning.enabled=true
  browser.companion.pageaction.enabled=true
  browser.companion.passwords.enabled=true
  signon.management.page.os-auth.enabled=false
  signon.rememberSignons=true
  browser.pinebuild.megaback.logLevel=All
  browser.companion.snapshot-groups.enabled=true
  browser.pinebuild.workshop.enabled=true
  browser.urlbar.opencompanionsearch.enabled=true

